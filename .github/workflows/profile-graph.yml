name: profile-graph

# Rebuilds assets/contrib.svg from real contribution data.
# Self-hosted on purpose: no third-party widget service, so the panel
# on the profile can never render a rate-limit error.

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graph
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution panel
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          CONTRIB_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build_contrib.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution graph"
          git push
