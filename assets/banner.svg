<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mohamed Aziz Ayari - AI Engineer, verifiable agent systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/><stop offset="55%" stop-color="#0D1526"/><stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/><stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g>
      <rect x="-40" y="-40" width="1280" height="420" fill="url(#grid)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 40; 0 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <ellipse cx="880" cy="150" rx="380" ry="240" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.9"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="98" fill="#7DD3FC" font-size="15" font-weight="600" letter-spacing="4.5">AI ENGINEER</text>
    <text x="64" y="163" fill="#F8FAFC" font-size="47" font-weight="700" letter-spacing="-0.6">Mohamed Aziz Ayari</text>
    <text x="64" y="212" fill="#94A3B8" font-size="27" font-weight="400">Verifiable agent systems</text>
    <rect x="64" y="252" width="4" height="46" rx="2" fill="url(#accent)"/>
    <text x="84" y="272" fill="#CBD5E1" font-size="15.5">Agents propose. Deterministic code decides.</text>
    <text x="84" y="293" fill="#64748B" font-size="15.5">An independent read of the world confirms what happened.</text>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" transform="translate(742,92)">

    <rect x="0" y="0" width="118" height="62" rx="10" fill="#0F1A2E" stroke="#334155" stroke-width="1.2"/>
    <text x="59" y="27" fill="#E2E8F0" font-size="13.5" font-weight="600" text-anchor="middle">MODEL</text>
    <text x="59" y="45" fill="#64748B" font-size="11.5" text-anchor="middle">proposes</text>

    <path d="M118 31 L156 31" stroke="#475569" stroke-width="1.6"/>
    <path d="M150 26 L157 31 L150 36 Z" fill="#475569"/>

    <rect x="157" y="0" width="118" height="62" rx="10" fill="#0F1A2E" stroke="#38BDF8" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="0.45;0.45;1;1;0.45" keyTimes="0;0.16;0.24;0.42;0.62" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="216" y="27" fill="#7DD3FC" font-size="13.5" font-weight="600" text-anchor="middle">POLICY</text>
    <text x="216" y="45" fill="#64748B" font-size="11.5" text-anchor="middle">decides</text>

    <path d="M216 62 L216 96" stroke="#475569" stroke-width="1.6"/>
    <path d="M211 90 L216 97 L221 90 Z" fill="#475569"/>

    <rect x="157" y="97" width="118" height="62" rx="10" fill="#0F1A2E" stroke="#334155" stroke-width="1.2">
      <animate attributeName="stroke" values="#334155;#334155;#34D399;#334155" keyTimes="0;0.44;0.52;0.72" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="216" y="124" fill="#E2E8F0" font-size="13.5" font-weight="600" text-anchor="middle">WORLD</text>
    <text x="216" y="142" fill="#64748B" font-size="11.5" text-anchor="middle">confirms</text>

    <rect x="0" y="97" width="118" height="62" rx="10" fill="#0B1220" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4">
      <animate attributeName="stroke" values="#334155;#334155;#F87171;#334155" keyTimes="0;0.76;0.84;0.96" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="59" y="124" fill="#94A3B8" font-size="13.5" font-weight="600" text-anchor="middle">REFUSED</text>
    <text x="59" y="142" fill="#64748B" font-size="11.5" text-anchor="middle">and logged</text>

    <path d="M170 62 L143 90 L143 128 L126 128" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 4"/>
    <path d="M132 123 L125 128 L132 133 Z" fill="#334155"/>

    <!-- proposal travelling model -> policy -->
    <circle r="3.6" fill="#38BDF8">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.18;0.21;1" dur="6s" repeatCount="indefinite"/>
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.2;1" calcMode="linear" path="M118 31 L157 31"/>
    </circle>

    <!-- authorised action policy -> world -->
    <circle r="3.6" fill="#34D399">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.5;0.53;1" dur="6s" repeatCount="indefinite"/>
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4;0.52;1" calcMode="linear" path="M216 62 L216 97"/>
    </circle>

    <!-- refused action policy -> refused -->
    <circle r="3.6" fill="#F87171">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.73;0.85;0.88;1" dur="6s" repeatCount="indefinite"/>
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.7;0.87;1" calcMode="linear" path="M170 62 L143 90 L143 128 L126 128"/>
    </circle>
  </g>
</svg>
