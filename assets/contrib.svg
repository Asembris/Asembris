<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Contribution activity panel — awaiting first workflow run">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#818CF8"/></linearGradient>
  </defs>
  <rect width="1200" height="200" rx="14" fill="#080D18"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#acc)" opacity="0.85"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="28" y="40" fill="#64748B" font-size="12" font-weight="600" letter-spacing="2.4">CONTRIBUTION ACTIVITY &#183; LAST 12 MONTHS</text>
    <text x="1172" y="40" fill="#334155" font-size="11.5" text-anchor="end">self-hosted &#183; rebuilt daily by GitHub Actions</text>
    <rect x="28" y="72" width="3" height="46" rx="1.5" fill="url(#acc)"/>
    <text x="46" y="94" fill="#CBD5E1" font-size="15.5">Waiting on the first build.</text>
    <text x="46" y="116" fill="#64748B" font-size="13.5">Add the CONTRIB_TOKEN secret, then run the <tspan fill="#7DD3FC">profile-graph</tspan> workflow from the Actions tab.</text>
    <circle cx="1150" cy="150" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1132" cy="150" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1114" cy="150" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
