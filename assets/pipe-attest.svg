<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Attest verdict path: claim, deterministic checkers, three-valued verdict, human approval, catalog write-back">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1A2E"/><stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="190" rx="12" fill="#080D18"/>
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#acc)" opacity="0.85"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="28" y="38" fill="#64748B" font-size="12" font-weight="600" letter-spacing="2.4">ATTEST &#183; VERDICT PATH</text>
    <rect x="28.0" y="58" width="216.0" height="74" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.2"/>
    <text x="136.0" y="90" fill="#E2E8F0" font-size="13.5" font-weight="600" text-anchor="middle">CLAIM</text>
    <text x="136.0" y="110" fill="#64748B" font-size="11.5" text-anchor="middle">explicit URN required</text>
    <path d="M246.0 95.0 L256.0 95.0" stroke="#475569" stroke-width="1.5"/>
    <path d="M252.0 91.0 L257.0 95.0 L252.0 99.0 Z" fill="#475569"/>
    <rect x="260.0" y="58" width="216.0" height="74" rx="10" fill="url(#node)" stroke="#38BDF8" stroke-width="1.7"/>
    <text x="368.0" y="90" fill="#7DD3FC" font-size="13.5" font-weight="600" text-anchor="middle">CHECKERS</text>
    <text x="368.0" y="110" fill="#64748B" font-size="11.5" text-anchor="middle">date math, set membership</text>
    <path d="M478.0 95.0 L488.0 95.0" stroke="#475569" stroke-width="1.5"/>
    <path d="M484.0 91.0 L489.0 95.0 L484.0 99.0 Z" fill="#475569"/>
    <rect x="492.0" y="58" width="216.0" height="74" rx="10" fill="url(#node)" stroke="#38BDF8" stroke-width="1.7"/>
    <text x="600.0" y="90" fill="#7DD3FC" font-size="13.5" font-weight="600" text-anchor="middle">VERDICT</text>
    <text x="600.0" y="110" fill="#64748B" font-size="11.5" text-anchor="middle">three-valued, no confidence</text>
    <path d="M710.0 95.0 L720.0 95.0" stroke="#475569" stroke-width="1.5"/>
    <path d="M716.0 91.0 L721.0 95.0 L716.0 99.0 Z" fill="#475569"/>
    <rect x="724.0" y="58" width="216.0" height="74" rx="10" fill="url(#node)" stroke="#334155" stroke-width="1.2"/>
    <text x="832.0" y="90" fill="#E2E8F0" font-size="13.5" font-weight="600" text-anchor="middle">HUMAN</text>
    <text x="832.0" y="110" fill="#64748B" font-size="11.5" text-anchor="middle">per-claim approval</text>
    <path d="M942.0 95.0 L952.0 95.0" stroke="#475569" stroke-width="1.5"/>
    <path d="M948.0 91.0 L953.0 95.0 L948.0 99.0 Z" fill="#475569"/>
    <rect x="956.0" y="58" width="216.0" height="74" rx="10" fill="url(#node)" stroke="#34D399" stroke-width="1.5"/>
    <text x="1064.0" y="90" fill="#6EE7B7" font-size="13.5" font-weight="600" text-anchor="middle">DATAHUB</text>
    <text x="1064.0" y="110" fill="#64748B" font-size="11.5" text-anchor="middle">content-addressed assertion</text>
    <rect x="28" y="154" width="3" height="20" rx="1.5" fill="url(#acc)"/>
    <text x="42" y="169" fill="#94A3B8" font-size="13.5">No model touches the verdict. A verdict that spends tokens is auto-FLAGGED and cannot be approved.</text>
  </g>
</svg>
